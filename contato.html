<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contato - PixelForge Studios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="cabecalho">
        <h2>PixelForge Studios</h2>
        <nav id="menu">
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
                <li><a href="pagina2.html"><i class="fa-solid fa-list-check"></i> Serviços</a></li>
                <li><a href="pagina3.html"><i class="fa-solid fa-briefcase"></i> Cases</a></li>
                <li><a href="contato.html"><i class="fa-solid fa-envelope"></i> Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 style="text-align: center;">Fale Conosco</h1>
        
        <form class="form-contato" action="#" method="POST">
            <div class="grupo-form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="grupo-form">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </div>

            <div class="grupo-form">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            </div>

            <div class="grupo-form">
                <label for="assunto">Assunto:</label>
                <input type="text" id="assunto" name="assunto" required placeholder="Assunto da mensagem">
            </div>

            <div class="grupo-form">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
            </div>

            <button type="submit" class="botao-enviar"><i class="fa-solid fa-paper-plane"></i> Enviar Mensagem</button>
        </form>
    </main>

    <footer id="rodape">
        <p><i class="fa-solid fa-copyright"></i> 2026 PixelForge Studios. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
